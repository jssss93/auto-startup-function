stages:
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.12"
  FUNCTION_APP_NAME: "function-auto-startup"
  RESOURCE_GROUP: "rg-common-gitlabrunner-kc-01"
  AZURE_SUBSCRIPTION_ID: "42f0cf0c-5a7a-4aca-9a9e-31b236b9defa"

build:
  stage: build
  image: python:3.12
  tags:
    - axd
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script: echo Build validate && python -m py_compile function_app.py && python -m py_compile start_vm/__init__.py && echo Build done
  artifacts:
    paths:
      - "*.py"
      - "*.json"
      - "*.txt"
      - "start_vm/"
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

deploy:production:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  tags:
    - axd
  before_script:
    - az --version
    - az login --identity
    - |
      if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
        AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        echo "Using detected subscription: $AZURE_SUBSCRIPTION_ID"
      fi
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az account show
    - chmod +x scripts/deploy.sh
  script:
    - ./scripts/deploy.sh $FUNCTION_APP_NAME $RESOURCE_GROUP
    - az functionapp function list --name $FUNCTION_APP_NAME --resource-group $RESOURCE_GROUP --output table || true
  environment:
    name: production
    url: https://${FUNCTION_APP_NAME}.azurewebsites.net
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

